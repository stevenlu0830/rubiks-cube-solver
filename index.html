<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installing to the home screen: name, icons and colours (and offline, see src/device/offline.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Paint your scrambled Rubik's cube, then follow the solution step by step."
    />
    <!--
      Mobile setup:
      - Pinch zoom stays allowed, so anyone can enlarge the text. Touches on
        the cube never zoom (touch-action: none in App.css), and buttons
        never double-tap zoom (touch-action: manipulation in index.css).
      - viewport-fit=cover: draw under the notch; safe-area padding in
        App.css keeps content clear of it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f4f4f6"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121216"
      media="(prefers-color-scheme: dark)"
    />
    <title>Rubik's Cube Solver</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
